[package]
name = "irmm-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
ironrdp-server = { version = "0.13", default-features = false, features = ["helper", "rayon"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"
enigo = "0.6"
arboard = "3"

# Pure-Rust X11: no system libraries needed, so the agent also runs on headless servers.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xtest"] }
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Security", "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Environment",
] }
