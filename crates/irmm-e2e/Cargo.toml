[package]
name = "irmm-e2e"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
iroh.workspace = true
irmm-proto.workspace = true
irmm-server.workspace = true
irmm-agent.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
totp-rs = { version = "5", features = ["otpauth"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
futures = "0.3"
tokio-tungstenite = "0.28"
irmm-desktop.workspace = true
async-trait = "0.1"
bytes = "1"
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input", "pdu", "core"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
ironrdp-rdcleanpath = "0.2"
x509-cert = { version = "0.2", features = ["std"] }
