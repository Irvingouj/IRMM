# IRMM: Postgres, server (API + console + agent hub), Caddy (HTTPS) and, with
# `--profile relay`, a self-hosted iroh-relay. Secrets come from the environment;
# run it through Infisical (see README.md).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: irmm
      POSTGRES_USER: irmm
      POSTGRES_PASSWORD: ${IRMM_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "irmm"]
      interval: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IRMM_DATABASE_URL: postgres://irmm:${IRMM_DB_PASSWORD}@postgres/irmm
      IRMM_PUBLIC_URL: https://${IRMM_DOMAIN:?}
      IRMM_IROH_PUBLIC_ADDRS: ${IRMM_DOMAIN}:7843
      IRMM_RELEASE_PUBLIC_KEY: ${IRMM_RELEASE_PUBLIC_KEY:?}
      IRMM_OPERATOR_TOKEN: ${IRMM_OPERATOR_TOKEN:?}
      IRMM_RELAY_URL: ${IRMM_RELAY_URL:-}
      IRMM_RELAY_ACCESS_TOKEN: ${IRMM_RELAY_ACCESS_TOKEN:-}
      IRMM_ICE_SERVERS: ${IRMM_ICE_SERVERS:-stun:stun.l.google.com:19302}
    ports:
      - "7843:7843/udp"
    volumes:
      - irmm-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${IRMM_DOMAIN} --to server:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - server

  relay:
    profiles: ["relay"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
    restart: unless-stopped
    environment:
      IRMM_RELAY_HOSTNAME: ${IRMM_RELAY_HOSTNAME:?}
      IRMM_ACME_EMAIL: ${IRMM_ACME_EMAIL:?}
      IROH_RELAY_HTTP_BEARER_TOKEN: ${IRMM_RELAY_ACCESS_TOKEN:?}
    # The relay needs its own host (or IP) for ports 80/443; 7842/udp is QUIC address discovery.
    ports:
      - "${IRMM_RELAY_BIND:-0.0.0.0}:80:80"
      - "${IRMM_RELAY_BIND:-0.0.0.0}:443:443"
      - "7842:7842/udp"
    volumes:
      - relay-certs:/certs

volumes:
  pgdata:
  irmm-data:
  caddy-data:
  relay-certs:
